name = "redesub"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# Currículos da página /trabalhe-conosco (functions/api/job-application.ts).
# Bucket PRIVADO — sem acesso público, sem Public Development URL habilitada.
# Criar em: Cloudflare dashboard → R2 → Create bucket → "redesub-job-applications"
# (ou `npx wrangler r2 bucket create redesub-job-applications`), depois
# conectar o binding abaixo ao Pages project em Settings → Functions →
# R2 bucket bindings (o nome do binding precisa ser exatamente RESUMES_BUCKET).
[[r2_buckets]]
binding = "RESUMES_BUCKET"
bucket_name = "redesub-job-applications"
